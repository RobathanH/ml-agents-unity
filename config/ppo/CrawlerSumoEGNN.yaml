behaviors:
  CrawlerSumo:
    trainer_type: ppo
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 4
      vis_encode_type: simple
      # Run 013: recurrent core. Runs 006-012 were feedforward, so feints,
      # timing and setup-then-commit were not representable -- the policy could
      # only ever produce reflexes, which caps how "intentional" behaviour can
      # look regardless of training length. memory_size 512 -> LSTM hidden 256.
      # NOT the default 256: NetworkBody feeds memory_size/2 to the output heads
      # (networks.py ~L253/L473), so 256 would have narrowed the head input from
      # 512 to 128 -- adding memory and shrinking the network in one change,
      # with no way to attribute the result. Compute is ~2% of the EGNN encoder,
      # which dominates forward cost at ~38M MACs (228 edge-MLP evals/layer).
      memory:
        memory_size: 512
        sequence_length: 32
      egnn_encoders:
        enabled: true
        auto: true # applies automatically to EGNN-named variable-length sensors only
        defaults:
          hidden_dim: 128
          message_dim: 64
          num_layers: 3
          k_neighbors: 12
          pos_dim: 3
          embedding_size: 128
    hyperparameters:
      # Run 013: 2048 -> 4096 (buffer scaled to keep the 10x ratio). With memory
      # enabled, batch_size still counts timesteps but gradients are effectively
      # over batch_size/sequence_length = 128 independent sequences; at the old
      # 2048 that would have been 32, a large jump in gradient noise on a run
      # that already destabilised late.
      batch_size: 4096
      buffer_size: 40960
      # Run 008: 0.001 -> 0.0003. Run 007's value loss exploded (2.5 -> 20) and
      # entropy rose late (1.42 -> 2.28) once rewards got bigger; stabilize.
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      # Run 013: constant -> linear. Run 012 ended at entropy 0.4985 with a
      # negative ELO slope -- the policy never sharpened, so late training
      # churned between styles instead of converging. beta decays with it;
      # epsilon is pinned constant on purpose (settings.py L51-57 silently
      # inherits both schedules from learning_rate_schedule, and decaying the
      # clip range on top of LR and beta makes late updates conservative in
      # three ways at once).
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: constant
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    # Run 013: 300M -> 80M. This is the schedule DENOMINATOR, not just a cap:
    # linear decay interpolates to zero at max_steps, so leaving it at 300M for
    # a run that stops near 80M would decay LR only 3e-4 -> 2.2e-4 and make the
    # annealing change above a silent no-op. Run 012 reached 79.4M in 24h.
    max_steps: 80000000
    time_horizon: 1000
    summary_freq: 1000 #10000
    self_play:
      # Run 007 changes (tournament evaluation of run 006 showed head-to-head
      # regression after ~5.5M steps that window-ELO missed): the old pool
      # (window 50 x save_steps 50k) spanned only 2.5M steps, so anything the
      # policy learned earlier was forgotten and strategies cycled. Wider
      # snapshot spacing spans 12.5M steps; lower latest-model ratio plays
      # more against the diverse pool.
      save_steps: 250000
      team_change: 9999999999 # Team swaps cause reward/loss instability, and are unnecessary in a symmetric env, so this will disable them
      swap_steps: 5000
      window: 50
      play_against_latest_model_ratio: 0.3
      initial_elo: 1200.0
environment_parameters:
  learning_team: 0
  
  # Spawn Settings (proportional to platform radius set in Unity scene)
  min_spawn_distance_proportion: 0.1   # (minimum separation)
  max_spawn_distance_proportion: 0.3  # (max distance from center)
  
  # Episode Settings
  max_episode_steps: 1500

  # Run 014: the SHRINKING RING (runs 009-013) IS GONE -- the arena is a fixed
  # 15u for the whole episode. It bought decisive endings out of the 006-008
  # draw-camping, but it bought them with a boundary the policy cannot see:
  # there is no step-count or ring-radius observation, and the obs it does get
  # (platform_radius/20, normalized edge distance, on-platform flag) are all
  # computed against the FULL radius, so they read "11u of margin" one step
  # before a ring-out. That is a second, implicit shaping channel pushing the
  # exact behaviours we then spent runs trying to remove -- hug the centre, stay
  # low in case the floor disappears -- and it puts an unlearnable floor under
  # value loss. Shaping belongs in the reward terms, where it is explicit and
  # priced. Decisiveness now has to come from center_control + pushing +
  # stability, which is what those weights are for.
  # Evidence this is affordable: every tournament in project history has been
  # run on a FIXED ring (eval builds never received the ring params), and run
  # 013's 16M checkpoint scored 39-18-7 = 11% draws there, the lowest ever.

  # ------------------- Run 011: direct-impact physics upgrades -------------------
  # Run 010 plateaued: tournament showed the 41M model roughly even with 15.5M
  # and losing to 26M head-to-head, 66-70% draws under standard rules -- agents
  # shuffle into each other and only win via the ring. Physics changes to make
  # direct impact (flipping, throws) viable. FIXED constants, not randomized:
  # unobserved per-episode physics variation inflates return variance (the 007
  # value-loss lesson) and we have no evidence the wider ranges are trainable.

  # Flip knockdown DISABLED (0 = off): flipping must win through the game, not
  # by rule. Its original justification leaned on the ring ("an inverted
  # crawler is immobile and the shrinking ring kills immobile agents"); with
  # the ring fixed, the natural punishment is instead that an immobile crawler
  # is trivial to shove off a 15u platform. Watch this: if flipped crawlers
  # start surviving to timeout, the answer is a bigger zero-sum
  # stability_reward (currently 0.01/step) -- an explicit price -- not a
  # knockdown rule.
  flip_knockdown_steps: 0
  flip_knockdown_dot: -0.2

  # Actuator strength: fixed 1.5x on both crawlers' maxJointSpring/
  # maxJointForceLimit (min == max -> constant). Stronger joints allow lifting
  # and flipping the opponent instead of just leaning.
  joint_strength_multiplier_min: 1.5
  joint_strength_multiplier_max: 1.5

  # Platform friction: fixed 1.0 (min == max -> constant). Averages with the
  # crawlers' default 0.6 -> effective ~0.8 vs 0.6 baseline: more traction
  # for wedge-and-lift leverage.
  platform_friction_min: 1.0
  platform_friction_max: 1.0

  # ---------------------------- Reward Weights (Zero-Sum) ----------------------------
  
  # Reward when one agent is in radius and other is out
  survival_reward: 0 #0.01

  # Run 007: anti-stalemate shaping. Run 006 converged to a defensive draw-heavy
  # meta (70-88% draws in evaluation; PushingReward stat ~0.0004 all run), so
  # center pressure, pushing incentive, and the decisive-win payoff are raised.

  # Reward when one agent is closer to center than other (scaled by relative distance in radius units)
  # Mid-008 adjustment: 0.2 -> 0.03. At 0.2, center-holding across a 1500-step
  # episode out-earned the +5 win -> policies learned to draw while camping
  # center (98% draws in evaluation at 15M steps). Shaping must stay well below
  # the terminal reward.
  center_control_reward: 0.03

  # Reward for velocity of opponent away from center (opponent vel away - self vel away) (vel toward center is ignored)
  # Run 013: 2.0 -> 0.3. This dense per-step term pays continuously for keeping
  # contact and shoving, and pays nothing for a committed action that misses --
  # it is a direct description of the low shuffle-and-grind behaviour runs
  # 011/012 converged to. center_control_reward got this same audit mid-008
  # (0.2 -> 0.03) for the same reason; pushing never did.
  pushing_reward: 0.3

  # Terminal reward for winning (one opponent falls off)
  # Run 008: back to 5 (8 inflated return variance -> value-loss blowup in 007);
  # pushing/center shaping kept at 007 levels since draw rates improved.
  win_reward: 5.0

  # Penalty for body touching ground (encourages proper locomotion)
  body_ground_penalty: 0.01

  # Reward for body stability (upright-ness)
  stability_reward: 0.01

  # ------------------------- Run 013: control costs -------------------------
  # Per-agent (NOT zero-sum -- a relative cost cancels when both agents share a
  # habit, which is exactly the equilibrium being broken). Applied per decision
  # in CrawlerSumoAgent.ApplyControlCosts; both crawlers pay the same function.

  # Metabolic cost: mean squared normalized joint strength over action dims
  # 12-19. Without it, max stiffness is strictly dominant, so 8 of the 20 action
  # dims saturate and go dead -- control degenerates to bang-bang targets
  # against rigid PD joints, which is the source of the jerking.
  energy_cost_weight: 0.005

  # Smoothness cost: mean squared change in the action vector between
  # consecutive decisions (DecisionPeriod 5, TakeActionsBetweenDecisions off,
  # so these are true consecutive decisions). Jitter was previously free.
  action_rate_cost_weight: 0.01

  # DIAGNOSTICS ONLY -- must mirror reward_signals.extrinsic.gamma above. The
  # environment cannot see trainer settings, so this is duplicated by hand; if
  # you change gamma, change this too. Used only to weight the EpRewardDisc/*
  # stats, never the reward sent to the trainer, so drift corrupts the
  # diagnostic and nothing else. Sanity check: EpRewardDisc/FinalDiscount should
  # equal gamma^(episode length in DECISIONS), i.e. 0.995^300 = 0.222 at the cap.
  stats_gamma: 0.995

  # SIZING IS A GUESS and is the first thing to check at the 5h judgment. Target
  # is that EpReward/EnergyCost + EpReward/ActionRateCost land around 10-20% of
  # EpReward/Terminal in magnitude. Much more and the policy buys stillness
  # (the ring punishes that, but it will still distort); much less and jitter
  # stays free. The new EpReward/* stats exist to make this a measurement.


