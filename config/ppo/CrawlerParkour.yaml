behaviors:
  CrawlerParkour:
    trainer_type: ppo
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 4
      vis_encode_type: simple
      # Recurrent for the same reason as CrawlerSumo run 013, but the need is
      # sharper here: an obstacle leaves the sensor window before it has been
      # cleared, so committing to a jump requires remembering what was there.
      # A feedforward policy cannot represent "I am mid-leap over a gap".
      # memory_size 512 -> LSTM hidden 256; NOT 256, because NetworkBody feeds
      # memory_size/2 to the output heads and that would silently halve the
      # head input while adding memory.
      memory:
        memory_size: 512
        sequence_length: 64
      egnn_encoders:
        enabled: true
        auto: true
        defaults:
          hidden_dim: 128
          message_dim: 64
          num_layers: 3
          # 25 entities (9 self + 16 obstacles) vs CrawlerSumo's 19, and the
          # obstacle nodes sit on surfaces rather than centroids, so the useful
          # neighbourhood is denser. 12 -> 16 keeps roughly the same fraction of
          # the graph visible per node.
          k_neighbors: 16
          pos_dim: 3
          embedding_size: 128
          # MUST mirror the EGNNSensorComponent toggles -- see SETUP.md. A
          # mismatch silently reinterprets geometry columns as one-hots.
          # Row: pos(3) quat(4) linvel(3) angvel(3) center_offset(3) extent(3)
          #      type(2) subtype(5) = 26
          attr_mode: equivariant
          has_quaternion: true
          has_linear_velocity: true
          has_angular_velocity: true
          # Obstacle nodes are emitted at the closest point on the surface, not
          # at the centroid; this is the displacement back to the centre, which
          # keeps the box encoding lossless.
          has_center_offset: true
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      # Pinned constant deliberately: settings.py inherits both schedules from
      # learning_rate_schedule unless told otherwise, and decaying the clip
      # range on top of LR and beta makes late updates conservative three ways
      # at once.
      epsilon_schedule: constant
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    # Schedule denominator AND a hard stop: linear decay interpolates to zero
    # here and the trainer exits here, so this has to bracket the run actually
    # booked. Too low and the instance idles on the clock after training ends;
    # too high and the schedules never move. Run 002 measured ~490 steps/s, so
    # the 12h booked for run 003 lands near 21M, and 30M leaves room for one +5h
    # extension while still decaying the learning rate to a third of its start.
    # The inherited 80000000 was ~4x any run this project has ever booked, which
    # is why LR and beta sat at their initial values for all of run 002.
    #
    # Run 005: 24h booked, the standing ceiling, with NO extension available --
    # so unlike every previous run this number does not need extension headroom
    # and should sit as close to the real total as the throughput estimate
    # allows. Run 004 measured 23.5M in 8.0h = ~820 steps/s; the longer episode
    # below removes half the resets, so 24h lands at or a little above 71M.
    # Undershooting is the cheap error (training just ends early and the
    # watchdog terminates on its own), overshooting leaves LR high at the end.
    max_steps: 72000000
    time_horizon: 1000
    summary_freq: 10000
    # No self_play block. Parkour is single-agent against a fixed task, so
    # there is no ghost-trainer non-stationarity -- which also means progress is
    # readable directly from reward instead of needing ELO.

environment_parameters:
  # 6000 x 0.02s = 120s. Doubled for run 005, because runs 003 and 004 both had
  # episode length pinned at the cap for their entire length -- effectively
  # EVERY episode timed out. At 60s a 128m track needs 2.13 m/s to finish and
  # run 004 topped out near 0.64, so the finish bonus was unreachable and the
  # only live gradient was the progress ratchet. At 120s finishing needs 1.06
  # m/s, which is roughly one doubling away from where run 004 actually got to.
  #
  # This does NOT scale the reward uniformly -- see scripts note in DESIGN.md
  # and the derivation the thresholds below come from:
  #   progress  caps at 10.0 either way, but is now reached at HALF the speed
  #   velocity  whole-episode budget (ApplyVelocityReward divides by
  #             MaxDecisions), so unchanged -- except an agent that finishes
  #             early collects only the fraction of the budget it was alive for
  #   cost      charged PER DECISION and never normalised, so it DOUBLES
  #   respawns  roughly double, being time-exposure to the same terrain
  max_episode_steps: 6000

  # Reward shape. Progress dominates; everything else prices a cost.
  progress_weight: 10.0
  # 5.0 cannot survive the longer episode. Once finishing is reachable, progress
  # saturates at 10.0 and the bonus is the ONLY term that still varies with
  # speed -- the dense velocity term actually FALLS as the agent gets faster,
  # because finishing early truncates how much of its budget it collects. At
  # finish_bonus 5.0 the whole ladder above the finishing speed collapses into
  # noise: 120s episodes score gentle 12.07, moderate 12.20, hard 11.87, which
  # is not even monotone, so no threshold can separate those lessons and the
  # curriculum would stall wherever it first landed.
  #
  # 15.0 restores the gradient the run exists to climb. Bare finish (1.06 m/s)
  # pays 7.5; 2.5 m/s pays 11.8. That 4.3 spread is what makes speed worth the
  # extra respawns, and it keeps the documented velocity_weight ceiling
  # (finish_bonus / 2 = 7.5) far above the 2.0 actually set.
  finish_bonus: 15.0
  # A respawn already costs the time to re-cover the ground (progress pays only
  # on max-so-far), so this is a nudge, not the real price of failure. Keeping
  # it small is the point: a large terminal-feeling penalty reproduces sumo's
  # conservative shuffle.
  respawn_penalty: 0.5
  fall_depth: 3.0

  # Dense locomotion reward -- the fix for run 002, which converged on standing
  # still at 5.5M steps and never recovered.
  #
  # Run 002's only positive terms were the progress ratchet and the finish
  # bonus, against control costs charged every decision. The ratchet pays only
  # when the agent beats its own deepest-ever z, so flailing forward and back
  # earns nothing from it while being charged in full, and once MaxProgress is
  # set the gradient it offers is gated behind exceeding that mark again. So
  # before a gait exists the only term with a reliable sign is the cost, and the
  # reward-maximising policy is stillness -- which PPO found by 5.5M steps and
  # never left. This term pays for down-track velocity at the instant it
  # happens, with no history to beat, so there is a smooth local gradient from
  # the first forward twitch.
  #
  # velocity_weight is the WHOLE-EPISODE budget for perfect locomotion (the
  # agent divides by decisions-per-episode), which keeps it commensurable with
  # progress_weight and the finish bonus. It must stay below finish_bonus / 2 =
  # 7.5, the amount the finish bonus varies by over an episode -- above that,
  # dawdling to the finish line collects more dense reward than the early-finish
  # bonus it gives up, and slow finishes beat fast ones. Left at 2.0 through the
  # run 005 change deliberately: raising it would not buy speed anyway, since an
  # agent that finishes early collects less of this budget, not more.
  velocity_weight: 2.0
  # A 120s episode (6000 steps x 0.02s) over a 128m track (16 x 8m) needs only
  # 1.06 m/s to finish, so 2.5 is no longer "the finishing speed plus margin" --
  # it is now an aspiration well past it, and that is the point. The finish
  # bonus is what pays for speed above 1.06; this term keeps a smooth gradient
  # pointing that way. The reward decays either side of it, so there is nothing
  # to gain from sprinting past 2.5.
  target_speed: 2.5

  # Control costs, carried over from CrawlerSumo run 013. Without an energy
  # cost the 8 strength dims saturate at maximum stiffness (strictly dominant)
  # and control collapses to bang-bang targets against rigid PD joints.
  energy_cost_weight: 0.002
  action_rate_cost_weight: 0.002
  # ...but ramped in with the curriculum rather than charged in full from step 1
  # (the controller scales both weights by lerp(floor, 1, difficulty)). These
  # costs make an efficient gait out of a working one; they cannot make a
  # working one out of nothing, and in run 002 they were the only term with a
  # reliable sign, which is what made stillness pay. At 0.1 the flat lesson
  # charges ~0.055/episode against a dense budget of 2.0, so even a feeble
  # 0.25 m/s shuffle out-earns standing still by ~30%.
  control_cost_floor: 0.1

  # Single scalar driving every obstacle bound (see ParkourDifficulty). It also
  # scales the control costs -- see control_cost_floor above.
  #
  # measure: reward, NOT progress. ML-Agents' "progress" measure is
  # trainer_steps / max_steps -- elapsed training time, not how far the agent
  # got -- so thresholds on it would make this a fixed clock schedule that
  # advances whether or not the agent can handle the next lesson.
  #
  # Thresholds rebuilt from the geometry for run 003, not adjusted: run 002's
  # assumed a control cost of ~1.2/episode against a measured 0.555, and the
  # dense velocity term and the cost ramp have both moved the scale again.
  # REBUILT AGAIN for run 005, because doubling max_episode_steps moves every
  # term by a different factor (see the note there). Run 003's ladder was
  #     flat 3.0  gentle 5.0  moderate 7.0  hard 8.5
  # and at 120s the same target gaits score 5.86 / 12.07 / 12.20 / 11.87 --
  # not monotone, so those thresholds are not merely stale, they are unusable.
  #
  # Model, matching the code term for term (reward005.py reproduces the run 003
  # table above to within 0.02, which is what makes it trustworthy here):
  #     distance = min(s*T, 127)          finish triggers at TrackLength - 1
  #     R = 10*distance/128
  #       + 2*V(s)*f                      f = fraction of the episode survived
  #       + 15*(1 - 0.5*f)                only if it finished
  #       - 2.4*f*lerp(0.1, 1, difficulty)
  #       - 0.5*respawns
  # with V(s) = (1 - (|s-2.5|/2.5)^2)^2, T = 120s.
  #
  # Each lesson's target gait is a real step past what run 005's WARM START
  # already earns at that lesson, not past what it earns on flat. Run 004's
  # final policy (0.638 m/s) scores 6.04 / 5.45 / 4.86 / 4.22 / 3.58 across
  # difficulties 0 / 0.25 / 0.5 / 0.75 / 1.0, so a threshold under ~6 on flat
  # would advance it for free and teach it nothing.
  #
  #   lesson    s(m/s)  finishes  prog   vel   bonus  cost  resp  R      thresh
  #   flat      0.85    no         7.97  0.64   0.00  0.24  0.10   8.27   8.0
  #   gentle    1.05    no         9.84  0.88   0.00  0.78  0.30   9.64   9.5
  #   moderate  1.20    yes        9.92  0.94   8.39  1.16  0.80  17.28  17.0
  #   hard      1.60    yes        9.92  1.00  10.04  1.23  1.50  18.23  18.0
  #
  # The jump at moderate is the point, not an accident: below it a lesson can be
  # cleared by covering ground, at and above it the track must actually be
  # FINISHED. Nothing in runs 001-004 ever demanded that, because nothing in
  # them could deliver it.
  #
  # The 2.4 is a walking agent's control cost over 1200 decisions -- twice run
  # 003's 1.2 over 600, since the cost is charged per decision and never
  # normalised. It is not the 0.555 run 002 measured; that was a motionless
  # policy, and energy is mean squared joint strength, which a vigorous gait
  # drives toward its maximum.
  #
  # Respawn estimates remain the loosest input and are still erred LENIENT, and
  # for the same reason as run 003: a threshold set too high strands the agent
  # on a lesson it has already mastered and wastes the whole run, while one set
  # slightly too low advances it early, which it can still learn out of.
  #
  # That estimate is the loosest part of this and it is deliberately erred
  # LENIENT. A threshold set too high strands the agent on a lesson it has
  # already mastered and wastes the whole run; one set slightly too low advances
  # it early, which it can still learn out of. Respawn estimates rise with
  # difficulty because obstacles are what cause falls: a run that stalls just
  # under a threshold with respawns well above these is being blocked by the
  # penalty, not by locomotion.
  difficulty:
    curriculum:
      - name: flat
        completion_criteria:
          measure: reward
          behavior: CrawlerParkour
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 8.0
        value: 0.0
      - name: gentle
        completion_criteria:
          measure: reward
          behavior: CrawlerParkour
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 9.5
        value: 0.25
      - name: moderate
        completion_criteria:
          measure: reward
          behavior: CrawlerParkour
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 17.0
        value: 0.5
      - name: hard
        completion_criteria:
          measure: reward
          behavior: CrawlerParkour
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 18.0
        value: 0.75
      - name: max
        value: 1.0
