behaviors:
  CrawlerParkour:
    trainer_type: ppo
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 4
      vis_encode_type: simple
      # Recurrent for the same reason as CrawlerSumo run 013, but the need is
      # sharper here: an obstacle leaves the sensor window before it has been
      # cleared, so committing to a jump requires remembering what was there.
      # A feedforward policy cannot represent "I am mid-leap over a gap".
      # memory_size 512 -> LSTM hidden 256; NOT 256, because NetworkBody feeds
      # memory_size/2 to the output heads and that would silently halve the
      # head input while adding memory.
      memory:
        memory_size: 512
        sequence_length: 64
      egnn_encoders:
        enabled: true
        auto: true
        defaults:
          hidden_dim: 128
          message_dim: 64
          num_layers: 3
          # 25 entities (9 self + 16 obstacles) vs CrawlerSumo's 19, and the
          # obstacle nodes sit on surfaces rather than centroids, so the useful
          # neighbourhood is denser. 12 -> 16 keeps roughly the same fraction of
          # the graph visible per node.
          k_neighbors: 16
          pos_dim: 3
          embedding_size: 128
          # MUST mirror the EGNNSensorComponent toggles -- see SETUP.md. A
          # mismatch silently reinterprets geometry columns as one-hots.
          # Row: pos(3) quat(4) linvel(3) angvel(3) center_offset(3) extent(3)
          #      type(2) subtype(5) = 26
          attr_mode: equivariant
          has_quaternion: true
          has_linear_velocity: true
          has_angular_velocity: true
          # Obstacle nodes are emitted at the closest point on the surface, not
          # at the centroid; this is the displacement back to the centre, which
          # keeps the box encoding lossless.
          has_center_offset: true
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      # RUN 009 IS A NEW RUN, NOT A RESUME, so the schedules are anchored at step 0
      # again and these go back to the project's standard starting values. Run 008's
      # extension carried rescaled ones (0.000158 / 0.00264) so its linear schedules
      # stayed continuous across a --resume that moved max_steps; that arithmetic is
      # DESIGN 10.8 and applies to restarts only. Carrying those numbers into a fresh
      # run would start it at half the intended learning rate for no reason at all.
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      #
      # ---- RUN 009: BETA GETS A FLOOR, AND THE FLOOR IS THE WHOLE VALUE ----
      #
      # Run 008 finished with entropy at -0.04 and still falling -- a policy that is
      # effectively deterministic. That is the right end state for a run whose job is
      # to exploit a gait it already has, and it is fatal for this one. Every change
      # run 009 makes is an invitation to a behaviour the current policy has never
      # once emitted: releasing a foot to slide out of a trap, folding a leg under the
      # body, leaving the ground on purpose. None of those is reachable by sharpening
      # a distribution around what run 008 already does.
      #
      # `linear` decays beta to a HARDCODED minimum of 1e-5 (ppo/optimizer_torch.py),
      # which is zero for any practical purpose -- so "give beta a floor" cannot be
      # done by picking a better start value under a linear schedule, because the
      # schedule always lands on the same place. Holding it constant IS the floor.
      #
      # THE COST IS REAL AND IS ACCEPTED. A policy kept stochastic to the last step
      # lands less precisely than one allowed to converge, and precise landing is
      # exactly what a Beam needs; run 009 should be expected to end with a slightly
      # scruffier gait than run 008's at the same skill. If it finds the behaviours,
      # run 010's job is to decay beta again and sharpen them.
      beta_schedule: constant
      # Pinned constant deliberately: settings.py inherits both schedules from
      # learning_rate_schedule unless told otherwise, and decaying the clip
      # range on top of LR and beta makes late updates conservative three ways
      # at once.
      epsilon_schedule: constant
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    # Schedule denominator AND a hard stop: linear decay interpolates to zero
    # here and the trainer exits here, so this has to bracket the run actually
    # booked. Too low and the instance idles on the clock after training ends;
    # too high and the schedules never move. Run 002 measured ~490 steps/s, so
    # the 12h booked for run 003 lands near 21M, and 30M leaves room for one +5h
    # extension while still decaying the learning rate to a third of its start.
    # The inherited 80000000 was ~4x any run this project has ever booked, which
    # is why LR and beta sat at their initial values for all of run 002.
    #
    # Run 006: 24h booked, the standing ceiling. Run 005 measured 68.2M in
    # 23.75h = ~798 steps/s. The 30s episode below multiplies episode resets by
    # 4x (track regeneration plus OnEpisodeBegin). The arithmetic says that is
    # cheap against 1500 physics steps -- roughly 77k generator ops per episode
    # per arena, i.e. tens of ops per physics step -- but it is a throughput risk
    # that has not been measured, so this sits slightly UNDER run 005's total.
    # Undershooting is the cheap error (training ends early and the watchdog
    # terminates on its own); overshooting leaves LR high at the end.
    #
    # Run 008: MEASURED, not estimated. Run 007 sustained 862 steps/s over 21.5h on
    # this exact env and instance type, so 24h of training is ~74.5M. 74M leaves the
    # LR schedule finishing just inside the booked time. Do not re-derive this from
    # the first few reporting windows -- env startup sits inside the first one and
    # made the same estimate 2.3x too low for run 006.
    #
    # Run 008 EXTENSION: 74M -> 97M. The run was still improving at MATCHED terrain
    # level when it reached its 24h stop (9 of 10 patterns up, late-vs-early inside
    # the same TerrainLevel bin) and the ladder had NOT equilibrated -- TerrainLevel
    # was still climbing, 6.63 -> 6.92 across the last two quarters. 74M was sized
    # off run 007's 862 steps/s; this run actually sustains 758.6 (58,500,000 steps
    # in 77,111 s -- stiffer joints cost solver time and higher rungs cost boxes),
    # so 97M is ~14.1h more from the restart. Sized to UNDERSHOOT the watchdog for
    # the reason given above: ending early is free, ending with LR still high is not.
    #
    # ---- RUN 009: SIZED FROM THE END OF RUN 008, NOT ITS START ----
    #
    # THROUGHPUT IS A FUNCTION OF TERRAIN LEVEL, so a curriculum that works makes its
    # own step budget wrong. Every estimate before this one was taken from the fast
    # part of the previous run and every one overshot:
    #
    #   run 007 measured        862 steps/s   -> run 008 booked 74M
    #   run 008 first half      758.6         (mean level ~6.3)
    #   run 008 second half     646           (mean level 7.42)
    #   run 008 delivered       92.4M of 97M in 36.0 h
    #
    # The second-half figure is the honest one: higher rungs carry more obstacle
    # boxes, and a run that succeeds spends its time there. 646 x 86,400 s = 55.8M for
    # the 24 h ceiling, and 55M is booked against it -- a 1.4% margin, plus whatever
    # run 009's own additions cost (four more actions, a per-decision friction write,
    # 210 more stat tags, all small but none of them free).
    #
    # If anything this is still generous, because run 009 starts on a policy that
    # cannot yet climb and will sit at cheap low rungs while it learns. Undershooting
    # remains the cheap error: training that ends early costs nothing but the
    # watchdog's remaining minutes, while training that ends with the learning rate
    # still high wastes the whole anneal.
    max_steps: 55000000
    # Deliberately ABOVE the 300 decisions an episode now contains (1500 physics
    # steps / DecisionPeriod 5), so each episode yields exactly one trajectory,
    # ending at the truncation and bootstrapped there. Splitting an episode into
    # several horizon-length trajectories would be correct too, but one episode =
    # one GAE segment keeps the truncation fix easy to reason about.
    time_horizon: 1000
    # 10000 -> 30000 for run 009, and it is the per-rung obstacle stats that force it.
    # Conditioning Cleared and Falls on terrain level turns 20 tags into 220, and
    # tfevents repeats every tag name on every write: run 008 measured 148 bytes per
    # scalar point across 73 tags, so the same run at 10000 would now write ~220 MB of
    # events to sync and load. 30000 puts it back near run 008's 92 MB.
    #
    # It also makes the new buckets readable rather than merely present. A window is
    # ~30000/300 = 100 episodes, and those spread over ten rungs and ten patterns; at
    # 10000 the thinnest (pattern, rung) cells would carry single-figure samples and
    # the conditioned series -- the whole point of the change -- would be noise.
    # 1833 windows over 55M steps is one every ~47 s, which is still live monitoring.
    summary_freq: 30000
    # No self_play block. Parkour is single-agent against a fixed task, so
    # there is no ghost-trainer non-stationarity -- which also means progress is
    # readable directly from reward instead of needing ELO.

environment_parameters:
  # RUN 006: no goal, no finish line, no terminal state.
  #
  # Runs 002-005 trained "cover a 128m track and cross the line". This one trains
  # "keep moving forward indefinitely, from any point in any track". That is not a
  # reweighting -- five things move together and each is load-bearing for the
  # others. Derivation in DESIGN.md section 6.
  #
  #  1. TRUNCATION. Nothing terminates any more, so the controller always calls
  #     Agent.EpisodeInterrupted() and the trainer bootstraps V(s_T). Run 005
  #     called EndEpisode() on timeout, forcing a value target of 0 for ~89% of
  #     its 55,832 episodes at a step nothing in the observation can see coming.
  #  2. RATE REWARDS. Every term is per-metre or per-second, so episode length and
  #     track length become free parameters. Run 005's 120s change moved each term
  #     by a different factor and made its own curriculum thresholds underivable.
  #  3. SHORT EPISODES, MID-TRACK SPAWN. Run 005 covered 63.5m of a 128m track
  #     every episode -- but always the SAME first 63.5m, including 16m of
  #     guaranteed-flat lead-in, so a quarter of every trajectory was flat by
  #     construction and the back half of the track was never seen. What matters
  #     is obstacles per collected timestep, not per episode.
  #  4. PER-ARENA TERRAIN LEVELS replace the global reward-threshold ladder.
  #  5. NO FINISH BONUS, and no finish-rate metrics.

  # 1500 x 0.02s = 30s, down from 120s. Shorter is the right direction once the
  # goal is gone: what buys terrain exposure is more STARTS, not more time per
  # start, and every start is now a uniform sample of the track. 30s also sits
  # just past the discount horizon (gamma 0.995 at 0.1s/decision gives
  # 1/(1-gamma) = 200 decisions = 20s), which is the regime where bootstrapping
  # at the truncation does real work without carrying the whole value estimate.
  max_episode_steps: 1500

  # ---- Reward. Both positive terms are RATES. ----
  #
  # These are run 005's numbers re-expressed, not new ones, and they are written
  # to full precision on purpose: progress_weight 10.0 over a 128m track is
  # exactly 10/128 = 0.078125 per metre, and velocity_weight 2.0 over 120s is
  # exactly 0.0166667 per second. Rounding the first to 0.08 would have been a
  # +2.4% bump to the DOMINANT reward term, which is not what "the warm start is
  # not shocked by it" is supposed to mean. What changes is that neither number is
  # coupled to a length any more.
  progress_per_meter: 0.078125
  velocity_per_second: 0.0166667
  # The ratchet is PRIMARY and the velocity term is shaping -- a deliberate
  # departure from legged-gym-style setups. A velocity-tracking reward charges the
  # agent for every step it is stopped, pricing a deliberate pause to set up a
  # leap as a loss; the max-so-far displacement ratchet is indifferent to WHEN
  # ground gets covered, so it tolerates the tactical slowdown a hard obstacle
  # needs while still paying nothing for oscillation. Velocity tracking is primary
  # in that literature because it needs a controller that FOLLOWS a commanded
  # velocity. We want "as far as possible" instead.
  target_speed: 2.5

  # ---- RUN 009: the air phase has a price ----
  #
  # Run 008 eliminated three explanations for `Gap` sitting at 0.7-3.1% cleared after
  # 92M steps. Not training duration: +0.1 to +0.8 points across 33M extra steps. Not
  # actuation: doubling the joint drive moved it by nothing. Not recklessness: falls
  # per entry 0.02, so the crawler is not failing the jump, it is walking to the edge
  # and stopping. What was left is that the reward makes stopping correct.
  #
  # Every positive term here is a rate against ground covered or seconds of good
  # locomotion, and a leap is neither. It is a second in which no foot can push, no
  # metre is guaranteed, and failure costs a respawn PLUS the walk back over ground
  # the max-so-far ratchet has already paid for and will not pay for twice. Stopping
  # at the edge was never timidity; it was the policy being right about its reward.
  #
  # 0.05/s is 3x velocity_per_second, so a second of flight is worth about three
  # seconds of good running. Sized to be felt without dominating: a 0.4 s leap earns
  # 0.02 against the 0.156 that clearing a 2 m gap earns in progress, so it tilts the
  # decision at the edge rather than making airtime an end in itself.
  #
  # The exploits are closed by shape rather than by clamps -- the term carries the
  # SAME speed and heading factors as the velocity reward, so hopping on the spot pays
  # zero (speed factor is zero at zero down-track velocity), being launched backwards
  # pays zero, and the agent cannot farm airtime by throwing itself off the track
  # because the term is suppressed once the body is below the local ground line.
  # Falling is already priced, by respawn_penalty.
  #
  # Set to 0 to reproduce runs 006-008 exactly.
  airborne_per_second: 0.05

  # A respawn already costs the time to re-cover the ground (progress pays only on
  # max-so-far), so this stays a nudge rather than the real price of failure.
  # Deliberately NOT converted into a terminal: terminating on a fall would make
  # "do not fall" a value-function property, but it also prices risk so high that
  # the optimal policy is a slow shuffle, and parkour needs risk.
  respawn_penalty: 0.5
  fall_depth: 3.0

  # Control costs, unchanged -- already per-decision rates, so they needed no
  # re-parameterisation. Without an energy cost the 8 strength dims saturate at
  # maximum stiffness and control collapses to bang-bang targets against rigid PD
  # joints.
  energy_cost_weight: 0.002
  action_rate_cost_weight: 0.002
  # ...but ramped in with difficulty rather than charged in full from step 1 (the
  # controller scales both by lerp(floor, 1, difficulty)). These costs make an
  # efficient gait out of a working one; they cannot make a working one out of
  # nothing, and in run 002 they were the only term with a reliable sign, which is
  # what made stillness pay.
  control_cost_floor: 0.1

  # ---- Per-arena terrain curriculum ----
  #
  # This replaces the reward-threshold ladder, and run 005 is the reason. That run
  # gated the `moderate` lesson at reward 17.0 while the policy scored 16.04 on
  # FLAT, the easiest terrain in the game -- so the gate was above anything it
  # could ever reach and the run was lost at launch. The failure is structural,
  # not a bad number: one global scalar threshold against a reward whose scale
  # moves whenever episode length, track length or any weight moves.
  #
  # Each arena now carries its own level and adapts on measured DISTANCE RATE, a
  # physical quantity that does not move when the reward is re-weighted. No global
  # threshold to mis-calibrate, each arena finds its own rung, and the population
  # spreads across the ladder so easy terrain is never taken away. This is Rudin
  # et al.'s game-inspired curriculum with rate in place of raw distance, so the
  # rule survives a change of episode length.
  #
  # 10 levels map onto the same 0..1 difficulty scalar every obstacle bound is
  # interpolated from, so this is a finer-grained version of run 005's five named
  # lessons rather than a different axis.
  #
  # initial_level 5 = difficulty 0.556, just above the 0.5 run 005 finished on,
  # because the warm start already handles that terrain. Arenas randomise
  # UNIFORMLY UP TO this rather than all starting on it: a population in lockstep
  # is what lets one bad promotion strand everything at once, and a spread means
  # speed-vs-level is readable from the first summary window instead of only after
  # the ladder has been climbed.
  initial_level: 5
  #
  # ---- RUN 008: the gate is a FRACTION per rung, not one speed for all of them ----
  #
  # Runs 006 and 007 both set promote_speed: 0.5 and both ratcheted every arena to
  # the ceiling. That is not a bad number, it is the wrong SHAPE of number. 0.5 m/s
  # is trivial on flat and hard at difficulty 1.0, so a single value is either below
  # the policy at every rung (ratchets up) or above it at every rung (strands) --
  # there is no value that holds a population in the middle. DESIGN 8.9.
  #
  # The gate is now promote_fraction x ReferenceRate[level], where ReferenceRate is
  # what run 007's final policy actually did at each rung (CrawlerParkourEnvController).
  # Run 007's measured rates, last 4M steps: L6 0.834, L7 0.667, L8 0.613, L9 0.537.
  # It sat at mean level 8.65 with promote_speed 0.5 -- below all four.
  #
  # THESE TWO NUMBERS WERE CHOSEN BY scripts/check_curriculum_gates.py, NOT BY EYE.
  # The obvious pair -- 1.0 promote (beat what the last policy did) and a wide 0.55
  # demote -- FAILS: at level 8 it gives p(promote) 0.46 against p(demote) 0.03, an
  # 18x upward bias, and the ladder ratchets to the ceiling again just more slowly.
  # A gate at the median of a distribution promotes half the time and demotes almost
  # never; that is a ratchet however the number was derived.
  #
  # 1.15 / 0.85 balances the walk against run 007's own per-episode spread:
  #
  #   rung   p(up)  p(down)  stay
  #   L6      0.35    0.49   0.16
  #   L7      0.33    0.42   0.25
  #   L8      0.26    0.28   0.47
  #   L9      0.16    0.16   0.68   (ceiling)
  #
  # so an arena holds its rung most episodes, and a POPULATION spreads across the
  # ladder instead of collecting at one end. Climbing then requires the policy to
  # actually get 15% better, which is the point.
  promote_fraction: 1.15
  demote_fraction: 0.85
  #
  # ---- RUN 009: THE CALIBRATION RULE CANNOT BE FOLLOWED, AND SAYING SO ----
  #
  # DESIGN 10.1: ReferenceRate measures the terrain and the physics TOGETHER, and must
  # be re-measured whenever either moves. Run 009 moves both -- new joint ranges, a new
  # actuator, new body friction -- so by that rule its curve is wrong.
  #
  # It cannot be re-measured. The procedure is to run the previous run's final policy
  # at each pinned rung, and run 009 changes the ACTION SPACE: run 008's policy emits
  # 20 numbers into a rig that wants 24 and drives joints whose limits have moved. There
  # is no policy that can be measured against this rig until one has been trained on it.
  #
  # So the curve below is run 008's, KNOWN to be wrong by an unknown factor, and this
  # scalar is the correction. It is an environment parameter and not a rebuild, so the
  # procedure is: read RateAtLevel/<L> a few million steps in, compare against
  # ReferenceRate x this, and if the gates sit on one side of the distribution at every
  # rung, set it and --resume. That is the same failure runs 006 and 007 died of, and
  # this is the first run that can fix it without a new Linux player.
  #
  # 1.0 at launch is the CONSERVATIVE direction, not a neutral one: too high a reference
  # makes promotion hard and strands arenas low, which wastes terrain exposure, while
  # too low re-creates the ratchet that made two runs unreadable. Stranding is
  # recoverable from within the run; a ratchet is not.
  reference_rate_scale: 1.0
  # Kept so runs 006 and 007 stay reproducible from their own configs. Ignored
  # whenever promote_fraction is positive.
  promote_speed: 0.5
  demote_speed: 0.15
  # Negative = adapt. An eval or viewer build has no python side channel, so it
  # pins the terrain from the command line instead:
  #   --env-param difficulty_pin=0.5
  # Any rollout used to judge a checkpoint MUST pass this, or it is being scored
  # on terrain the training run never ran.
  difficulty_pin: -1

  # ---- Spawn ----
  #
  # Segment boundaries are the one longitudinal position the generator already
  # guarantees is clear (obstacles are inset 15% of a segment from each end), and
  # the picker re-derives ground and headroom at +/- half a body length before
  # accepting one. Verified over 60,000 picks in the offline harness: 0 spawns
  # over void, 0 with headroom under 1.5m, 0 tracks with no candidate found.
  #
  # 10 segments = 80m of runway ahead of every spawn. Sized against target_speed,
  # NOT against measured speed: 2.5 m/s x 30s = 75m. Run 006's policy has never
  # exceeded ~0.7 m/s, so 48m would have been ample in practice -- and would have
  # become a silent ceiling exactly when the run started working, with the agent
  # running off the end onto the apron and recording falls the terrain never
  # posed. The reward points at 2.5 m/s, so the track has to allow 2.5 m/s.
  spawn_reserve_segments: 10
  # Heading and initial-speed randomisation. BodyPart.Reset restores an identical
  # pose every episode, so before run 006 the only off-axis states the policy ever
  # saw were ones it had already fallen into. Rigid yaw only -- per-joint jitter
  # would risk popping a ConfigurableJoint whose anchors are fixed at setup, and
  # that would surface as a mystery reward spike rather than as an error.
  spawn_yaw_jitter: 30
  spawn_speed_jitter: 0.5

  # ---- Track ----
  #
  # 24 x 8m = 192m, up from 128m. Forced by the reserve above: 16 segments minus a
  # 10-segment reserve leaves only 6 usable spawn boundaries, which would
  # re-concentrate the start distribution near the beginning of the track and undo
  # most of the point of spawning mid-track. 24 leaves 14, spread over the first
  # 112m. Total extent is 192m plus two 4m aprons = 200m, inside the 220m
  # ArenaSpacingZ the 32-arena scene is laid out on, so no scene change is needed.
  #
  # max_boxes is a safety ceiling, not a target -- the harness measures 36 boxes
  # average and 50 worst case at 16 segments, so 24 segments lands near 54/75.
  #
  # A long eval rollout needs more still (140s at 2.5 m/s is 350m), which is what
  # these are exposed for:
  #   --env-param segment_count=52 --env-param max_boxes=700
  # Training arenas stay small, so the 32-arena scene does not pay for it.
  segment_count: 24
  max_boxes: 330
