behaviors:
  CrawlerParkour:
    trainer_type: ppo
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 4
      vis_encode_type: simple
      # Recurrent for the same reason as CrawlerSumo run 013, but the need is
      # sharper here: an obstacle leaves the sensor window before it has been
      # cleared, so committing to a jump requires remembering what was there.
      # A feedforward policy cannot represent "I am mid-leap over a gap".
      # memory_size 512 -> LSTM hidden 256; NOT 256, because NetworkBody feeds
      # memory_size/2 to the output heads and that would silently halve the
      # head input while adding memory.
      memory:
        memory_size: 512
        sequence_length: 64
      egnn_encoders:
        enabled: true
        auto: true
        defaults:
          hidden_dim: 128
          message_dim: 64
          num_layers: 3
          # 25 entities (9 self + 16 obstacles) vs CrawlerSumo's 19, and the
          # obstacle nodes sit on surfaces rather than centroids, so the useful
          # neighbourhood is denser. 12 -> 16 keeps roughly the same fraction of
          # the graph visible per node.
          k_neighbors: 16
          pos_dim: 3
          embedding_size: 128
          # MUST mirror the EGNNSensorComponent toggles -- see SETUP.md. A
          # mismatch silently reinterprets geometry columns as one-hots.
          # Row: pos(3) quat(4) linvel(3) angvel(3) center_offset(3) extent(3)
          #      type(2) subtype(5) = 26
          attr_mode: equivariant
          has_quaternion: true
          has_linear_velocity: true
          has_angular_velocity: true
          # Obstacle nodes are emitted at the closest point on the surface, not
          # at the centroid; this is the displacement back to the centre, which
          # keeps the box encoding lossless.
          has_center_offset: true
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      # Pinned constant deliberately: settings.py inherits both schedules from
      # learning_rate_schedule unless told otherwise, and decaying the clip
      # range on top of LR and beta makes late updates conservative three ways
      # at once.
      epsilon_schedule: constant
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    # Schedule denominator AND a hard stop: linear decay interpolates to zero
    # here and the trainer exits here, so this has to bracket the run actually
    # booked. Too low and the instance idles on the clock after training ends;
    # too high and the schedules never move. Run 002 measured ~490 steps/s, so
    # the 12h booked for run 003 lands near 21M, and 30M leaves room for one +5h
    # extension while still decaying the learning rate to a third of its start.
    # The inherited 80000000 was ~4x any run this project has ever booked, which
    # is why LR and beta sat at their initial values for all of run 002.
    max_steps: 30000000
    time_horizon: 1000
    summary_freq: 10000
    # No self_play block. Parkour is single-agent against a fixed task, so
    # there is no ghost-trainer non-stationarity -- which also means progress is
    # readable directly from reward instead of needing ELO.

environment_parameters:
  max_episode_steps: 3000

  # Reward shape. Progress dominates; everything else prices a cost.
  progress_weight: 10.0
  finish_bonus: 5.0
  # A respawn already costs the time to re-cover the ground (progress pays only
  # on max-so-far), so this is a nudge, not the real price of failure. Keeping
  # it small is the point: a large terminal-feeling penalty reproduces sumo's
  # conservative shuffle.
  respawn_penalty: 0.5
  fall_depth: 3.0

  # Dense locomotion reward -- the fix for run 002, which converged on standing
  # still at 5.5M steps and never recovered.
  #
  # Run 002's only positive terms were the progress ratchet and the finish
  # bonus, against control costs charged every decision. The ratchet pays only
  # when the agent beats its own deepest-ever z, so flailing forward and back
  # earns nothing from it while being charged in full, and once MaxProgress is
  # set the gradient it offers is gated behind exceeding that mark again. So
  # before a gait exists the only term with a reliable sign is the cost, and the
  # reward-maximising policy is stillness -- which PPO found by 5.5M steps and
  # never left. This term pays for down-track velocity at the instant it
  # happens, with no history to beat, so there is a smooth local gradient from
  # the first forward twitch.
  #
  # velocity_weight is the WHOLE-EPISODE budget for perfect locomotion (the
  # agent divides by decisions-per-episode), which keeps it commensurable with
  # progress_weight and the finish bonus. It must stay below finish_bonus / 2 =
  # 2.5, the amount the finish bonus varies by over an episode -- above that,
  # dawdling to the finish line collects more dense reward than the early-finish
  # bonus it gives up, and slow finishes beat fast ones.
  velocity_weight: 2.0
  # 60s episode (3000 steps x 0.02s) over a 128m track (16 x 8m) needs 2.13 m/s
  # to finish. 2.5 gives that a margin. The reward decays either side of it, so
  # there is nothing to gain from sprinting.
  target_speed: 2.5

  # Control costs, carried over from CrawlerSumo run 013. Without an energy
  # cost the 8 strength dims saturate at maximum stiffness (strictly dominant)
  # and control collapses to bang-bang targets against rigid PD joints.
  energy_cost_weight: 0.002
  action_rate_cost_weight: 0.002
  # ...but ramped in with the curriculum rather than charged in full from step 1
  # (the controller scales both weights by lerp(floor, 1, difficulty)). These
  # costs make an efficient gait out of a working one; they cannot make a
  # working one out of nothing, and in run 002 they were the only term with a
  # reliable sign, which is what made stillness pay. At 0.1 the flat lesson
  # charges ~0.055/episode against a dense budget of 2.0, so even a feeble
  # 0.25 m/s shuffle out-earns standing still by ~30%.
  control_cost_floor: 0.1

  # Single scalar driving every obstacle bound (see ParkourDifficulty). It also
  # scales the control costs -- see control_cost_floor above.
  #
  # measure: reward, NOT progress. ML-Agents' "progress" measure is
  # trainer_steps / max_steps -- elapsed training time, not how far the agent
  # got -- so thresholds on it would make this a fixed clock schedule that
  # advances whether or not the agent can handle the next lesson.
  #
  # Thresholds rebuilt from the geometry for run 003, not adjusted: run 002's
  # assumed a control cost of ~1.2/episode against a measured 0.555, and the
  # dense velocity term and the cost ramp have both moved the scale again.
  #
  # A 60s episode (3000 steps x 0.02s) over a 128m track (16 x 8m) means a
  # steady speed s covers fraction P = s / 2.133 of the track and earns
  #     R = 10*P + 2*V(s) - 0.5*respawns - 1.2*lerp(0.1, 1, difficulty)
  # with V(s) = (1 - (|s-2.5|/2.5)^2)^2, the dense term's per-decision shape.
  #
  #   lesson    s(m/s)  P     V     respawns  cost  ->  R     threshold
  #   flat      0.64    0.30  0.20  0.3       0.12      3.13   3.0
  #   gentle    1.07    0.50  0.45  0.5       0.39      5.27   5.0
  #   moderate  1.49    0.70  0.70  1.0       0.66      7.24   7.0
  #   hard      1.81    0.85  0.85  1.5       0.93      8.53   8.5
  #
  # Each lesson therefore asks for a real gait covering 30/50/70/85 percent of
  # the track. The 1.2 is a walking agent's control cost, not the 0.555 run 002
  # measured -- that was a motionless policy, and energy is mean squared joint
  # strength, which a vigorous gait drives toward its maximum of 1.2.
  #
  # That estimate is the loosest part of this and it is deliberately erred
  # LENIENT. A threshold set too high strands the agent on a lesson it has
  # already mastered and wastes the whole run; one set slightly too low advances
  # it early, which it can still learn out of. Respawn estimates rise with
  # difficulty because obstacles are what cause falls: a run that stalls just
  # under a threshold with respawns well above these is being blocked by the
  # penalty, not by locomotion.
  difficulty:
    curriculum:
      - name: flat
        completion_criteria:
          measure: reward
          behavior: CrawlerParkour
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 3.0
        value: 0.0
      - name: gentle
        completion_criteria:
          measure: reward
          behavior: CrawlerParkour
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 5.0
        value: 0.25
      - name: moderate
        completion_criteria:
          measure: reward
          behavior: CrawlerParkour
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 7.0
        value: 0.5
      - name: hard
        completion_criteria:
          measure: reward
          behavior: CrawlerParkour
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 8.5
        value: 0.75
      - name: max
        value: 1.0
